syntax = "proto3";

package common;

option go_package = "github.com/yourorg/sdk/go/proto/common";

// Shared metadata for all requests
message RequestContext {
  string traceId = 1;
  string correlationId = 2;
  string tenantId = 3;
  string userId = 4;
  string ipAddress = 5;
  string userAgent = 6;
  int64 timestamp = 7;
}

// Standard error response
message ErrorResponse {
  string code = 1;
  string message = 2;
  map<string, string> details = 3;
}

// Pagination
message PaginationRequest {
  int32 page = 1;
  int32 limit = 2;
  string cursor = 3;
}

message PaginationResponse {
  int32 total = 1;
  int32 page = 2;
  int32 limit = 3;
  string next_cursor = 4;
  bool has_more = 5;
}

// Common enums
enum Status {
  STATUS_UNSPECIFIED = 0;
  STATUS_ACTIVE = 1;
  STATUS_INACTIVE = 2;
  STATUS_SUSPENDED = 3;
  STATUS_PENDING = 4;
}

message DeleteResponse {
  bool success = 1;
  ErrorResponse error = 2;
}
